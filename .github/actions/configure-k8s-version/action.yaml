name: Configure Kubernetes version
description: Update kubernetes.json with the specified Kubernetes version

inputs:
  kubernetes_version:
    description: 'Kubernetes version (e.g., 1.31.1)'
    required: true

runs:
  using: composite
  steps:
    - name: Configure Kubernetes version
      working-directory: images/capi/packer/config
      shell: bash
      env:
        KUBERNETES_VERSION: ${{ inputs.kubernetes_version }}
      run: |
        set -euo pipefail
        # Normalize: accept versions with or without a leading "v".
        KUBERNETES_VERSION="${KUBERNETES_VERSION#v}"
        # Series is the MAJOR.MINOR of the numeric core, before any pre-release suffix.
        KUBERNETES_CORE="${KUBERNETES_VERSION%%-*}"
        KUBERNETES_RELEASE=$(echo "${KUBERNETES_CORE}" | cut -d "." -f -2)
        sed -i "s/^  \"kubernetes_series\".*/  \"kubernetes_series\": \"v${KUBERNETES_RELEASE}\",/g" kubernetes.json
        sed -i "s/^  \"kubernetes_semver\".*/  \"kubernetes_semver\": \"v${KUBERNETES_VERSION}\",/g" kubernetes.json

        if [[ "${KUBERNETES_VERSION}" == *-* ]]; then
          # Pre-release (alpha/beta/rc): the community package repos (pkgs.k8s.io)
          # only publish final releases, so install binaries from dl.k8s.io instead.
          echo "Pre-release ${KUBERNETES_VERSION} detected; installing from upstream binaries (kubernetes_source_type=http)."
          sed -i "s/^  \"kubernetes_source_type\".*/  \"kubernetes_source_type\": \"http\",/g" kubernetes.json
        else
          KUBERNETES_DEB_VERSION=$(python3 "${GITHUB_ACTION_PATH}/resolve-kubernetes-deb-version.py" "${KUBERNETES_VERSION}")
          sed -i "s/^  \"kubernetes_source_type\".*/  \"kubernetes_source_type\": \"pkg\",/g" kubernetes.json
          sed -i "s/^  \"kubernetes_rpm_version\".*/  \"kubernetes_rpm_version\": \"${KUBERNETES_VERSION}\",/g" kubernetes.json
          sed -i "s/^  \"kubernetes_deb_version\".*/  \"kubernetes_deb_version\": \"${KUBERNETES_DEB_VERSION}\",/g" kubernetes.json
        fi

        grep -q "\"kubernetes_semver\": \"v${KUBERNETES_VERSION}\"" kubernetes.json || { echo 'ERROR: kubernetes version not set in kubernetes.json'; exit 1; }
        cat kubernetes.json
